name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  secret:
    name: secret (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: go (vet, race, gosec, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  db:
    name: db (migrate replay + sqlc diff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absensi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d absensi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/absensi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: migrate from empty
        run: go run ./cmd/migrate up
      - name: replay down 1 -> up
        run: |
          go run ./cmd/migrate down 1
          go run ./cmd/migrate up
      - name: sqlc generate (pinned)
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.28.0 generate -f db/sqlc.yaml
      - name: sqlc output is committed
        run: git diff --exit-code -- internal/store
      - name: integration tests against real Postgres
        run: go test -race ./...

  contract:
    name: contract (OpenAPI + FE types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web contract:types
      - name: generated FE types are committed
        run: git diff --exit-code -- web/src/lib/api

  web:
    name: web (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec tsc --noEmit
      - run: pnpm --dir web exec eslint . --max-warnings=0
      - run: pnpm --dir web exec vitest run
      - run: pnpm --dir web build

  e2e:
    name: e2e (compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: run e2e gate
        run: ./scripts/e2e.sh
      - name: upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  context:
    name: context (router, env, external)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: env-check + generated catalog is committed
        run: |
          node scripts/context/env-check.mjs --md docs/generated/env.md
          git diff --exit-code -- docs/generated/env.md
      - name: context router (strict)
        run: node scripts/context/router.mjs --strict --base "origin/${{ github.base_ref || 'main' }}"
      - name: external context check
        run: node scripts/context/external.mjs --check
